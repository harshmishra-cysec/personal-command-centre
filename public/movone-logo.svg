<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" fill="none" width="100%" height="100%">
  <!-- MOVONE Official Brand Logotype (logo2) -->
  <defs>
    <!-- Rich Gold Shading for Tactical Knight "1" -->
    <linearGradient id="movGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E296"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8828"/>
    </linearGradient>

    <linearGradient id="movGoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59E30"/>
      <stop offset="100%" stop-color="#7A5E16"/>
    </linearGradient>

    <linearGradient id="movGoldBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5C358"/>
      <stop offset="100%" stop-color="#8F6F1D"/>
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Group for crisp rendering -->
  <g id="MOVONE-Brand">
    <!-- === LEFT: "MOV" === -->
    <!-- M -->
    <path d="M 32 108 L 32 40 L 48 40 L 66 76 L 84 40 L 100 40 L 100 108 L 86 108 L 86 64 L 73 90 L 59 90 L 46 64 L 46 108 Z" fill="#FFFFFF"/>

    <!-- O -->
    <path d="M 148 40 C 127 40, 114 54, 114 74 C 114 94, 127 108, 148 108 C 169 108, 182 94, 182 74 C 182 54, 169 40, 148 40 Z M 148 54 C 158 54, 166 62, 166 74 C 166 86, 158 94, 148 94 C 138 94, 130 86, 130 74 C 130 62, 138 54, 148 54 Z" fill="#FFFFFF"/>

    <!-- V -->
    <path d="M 195 40 L 211 40 L 227 88 L 243 40 L 259 40 L 235 108 L 219 108 Z" fill="#FFFFFF"/>

    <!-- === CENTER: GOLDEN CHESS KNIGHT (The "1") === -->
    <g id="Knight-1" filter="url(#goldGlow)">
      <!-- Pedestal Tier 1 (Baseplate) -->
      <rect x="254" y="104" width="46" height="5" rx="1.5" fill="url(#movGoldBase)"/>
      <!-- Pedestal Tier 2 (Beveled collar) -->
      <path d="M 259 104 L 263 98 L 291 98 L 295 104 Z" fill="url(#movGoldDark)"/>
      <rect x="264" y="96" width="26" height="2.5" rx="1" fill="url(#movGoldLight)"/>

      <!-- Knight Body Silhouette & Highlights -->
      <!-- Left shaded / highlighted facet -->
      <path d="M 268 96 
               C 272 86, 271 70, 279 56 
               C 280 54, 282 51, 283 52 
               C 285 53, 287 56, 288 61 
               L 289 46 
               C 290 43, 292 42, 293 44 
               L 294 48 
               C 298 55, 301 60, 301 62
               C 304 64, 307 70, 309 74 
               C 310 76, 311 79, 310 81 
               L 305 83 
               C 304 84, 302 83, 300 81 
               C 296 79, 293 77, 292 78 
               C 290 79, 289 82, 293 90 
               L 290 96 
               Z" 
            fill="url(#movGoldLight)"/>

      <!-- Inner Shadow & Mane Facets -->
      <path d="M 284 56 
               C 278 61, 272 68, 270 76 
               L 274 76 
               C 269 82, 266 88, 265 96 
               L 270 96 
               C 272 88, 276 78, 286 58 
               Z" 
            fill="url(#movGoldDark)"/>

      <!-- Tactical Slit Eye -->
      <path d="M 293 64 L 299 67 L 294 68 Z" fill="#0B0F17"/>
    </g>

    <!-- === RIGHT: "ONE" === -->
    <!-- O -->
    <path d="M 338 40 C 317 40, 304 54, 304 74 C 304 94, 317 108, 338 108 C 359 108, 372 94, 372 74 C 372 54, 359 40, 338 40 Z M 338 54 C 348 54, 356 62, 356 74 C 356 86, 348 94, 338 94 C 328 94, 320 86, 320 74 C 320 62, 328 54, 338 54 Z" fill="#FFFFFF"/>

    <!-- N -->
    <path d="M 386 40 L 401 40 L 420 82 L 420 40 L 435 40 L 435 108 L 420 108 L 401 66 L 401 108 L 386 108 Z" fill="#FFFFFF"/>

    <!-- E (with aerodynamic angled edges) -->
    <path d="M 448 40 L 492 40 L 488 53 L 464 53 L 464 68 L 485 68 L 482 80 L 464 80 L 464 95 L 493 95 L 489 108 L 448 108 Z" fill="#FFFFFF"/>
  </g>
</svg>
